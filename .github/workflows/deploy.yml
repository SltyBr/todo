name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Fail the deploy if the live page or its JS bundle doesn't load
      # (catches a wrong Vite base or Pages misconfiguration).
      - name: Smoke-test the deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          origin=$(echo "$PAGE_URL" | cut -d/ -f1-3)
          smoke() {
            html=$(curl -fsS "$PAGE_URL") || return 1
            script=$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)
            [ -n "$script" ] || return 1
            curl -fsS -o /dev/null "$origin$script" || return 1
            echo "OK: $PAGE_URL and $script"
          }
          for attempt in 1 2 3 4 5 6; do
            smoke && exit 0
            echo "Attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          exit 1
